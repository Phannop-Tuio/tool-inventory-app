
<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#17365d">
  <title>Tool Inventory Management</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f1f4f8;
      color: #243247;
    }
    header {
      background: #17365d;
      color: white;
      padding: 22px;
      text-align: center;
    }
    main {
      max-width: 850px;
      margin: 50px auto;
      padding: 20px;
    }
    .card {
      background: white;
      padding: 35px;
      border-radius: 12px;
      box-shadow: 0 4px 18px #00000012;
      text-align: center;
    }
    .status {
      display: inline-block;
      background: #e1f5e8;
      color: #16803c;
      padding: 8px 16px;
      border-radius: 20px;
      margin-top: 15px;
    }
  </style>
</head>
<body>
  <header>
    <h1>Tool Inventory Management</h1>
    <p>ระบบบริหารจัดการคลังเครื่องมือ</p>
  </header>

  <main>
    <section class="card">
      <h2>ยินดีต้อนรับ</h2>
      <p>ระบบคลังเครื่องมือกำลังอยู่ระหว่างการพัฒนา</p>
      <span class="status">System Initialized</span>
    </section>
  </main>
</body>
</html>
